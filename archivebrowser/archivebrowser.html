<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Archive Browser · YouTube Playlists</title>
    <link rel="preconnect" href="https://i.ytimg.com">
    <link rel="dns-prefetch" href="https://i.ytimg.com">
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="dns-prefetch" href="https://www.youtube.com">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body { height: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .archive-container {
            max-width: 1600px;
            width: 100%;
            height: calc(100vh - 24px);
            height: calc(100dvh - 24px);
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .archive-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid #2a2a2a;
            background: #0d0d0d;
            border-radius: 16px 16px 0 0;
            flex-shrink: 0;
            gap: 12px;
        }

        .header-left { min-width: 0; }

        .header-left h1 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #ffffff;
            letter-spacing: -0.01em;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-left .subtitle {
            font-size: 0.8rem;
            color: #888;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-right {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .badge-pill {
            background: rgba(120, 81, 169, 0.25);
            border: 1px solid #7851A9;
            color: #fff;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .archive-main {
            display: flex;
            flex: 1;
            gap: 12px;
            padding: 12px;
            min-height: 0;
            background: #0a0a0a;
        }

        .song-panel {
            flex: 3;
            min-width: 0;
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .song-header {
            padding: 14px 16px 10px 16px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .song-header h3 {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #888;
            white-space: nowrap;
        }

        .song-header .song-total {
            font-size: 0.65rem;
            color: #aaa;
            background: #1f1f1f;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid #333;
            white-space: nowrap;
        }

        .song-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px 16px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .song-list.grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
            align-content: start;
        }

        .song-item {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-left: 3px solid var(--pl-color, #2a2a2a);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: 0.2s;
            cursor: pointer;
        }

        .song-item:hover {
            border-color: var(--pl-color, #7851A9);
            border-left-color: var(--pl-color, #7851A9);
            background: #1f1f1f;
            transform: translateX(4px);
            box-shadow: 0 8px 20px -12px var(--pl-color, rgba(120, 81, 169, 0.5));
        }

        .song-thumb {
            width: 80px;
            height: 45px;
            background: #0d0d0d;
            border-radius: 8px;
            border: 1px solid #333;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }

        .song-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        .song-thumb .fallback-icon {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--pl-color, #fada5e);
            font-size: 1.2rem;
            background: #0d0d0d;
        }

        .song-info { flex: 1; min-width: 0; }

        .song-title {
            font-size: 0.85rem;
            color: #eee;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-meta {
            font-size: 0.65rem;
            color: #888;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .song-meta .dot {
            width: 4px;
            height: 4px;
            background: #555;
            border-radius: 50%;
            display: inline-block;
        }

        .playlist-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 600;
            background: color-mix(in srgb, var(--pl-color, #7851A9) 18%, transparent);
            border: 1px solid color-mix(in srgb, var(--pl-color, #7851A9) 60%, transparent);
            color: var(--pl-color, #c9a8e8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90%;
        }

        @supports not (background: color-mix(in srgb, red 50%, transparent)) {
            .playlist-pill {
                background: rgba(120, 81, 169, 0.15);
                border: 1px solid rgba(120, 81, 169, 0.5);
                color: #c9a8e8;
            }
        }

        .playlist-pill .swatch {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--pl-color, #7851A9);
            flex-shrink: 0;
        }

		.refresh-btn {
			background: #1f1f1f;
			border: 1px solid #333;
			color: #aaa;
			font-size: 0.75rem;
			cursor: pointer;
			padding: 5px 8px;
			border-radius: 6px;
			transition: 0.2s;
			line-height: 1;
			font-family: 'Inter', sans-serif;
			flex-shrink: 0;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			-webkit-appearance: none;
		}

		.refresh-btn:hover {
			background: #2a2a2a;
			border-color: #7851A9;
			color: #fff;
		}

		.refresh-btn.spinning {
			animation: spin 0.8s linear infinite;
			color: #9A6BBE;
		}

		@keyframes spin {
			to { transform: rotate(360deg); }
		}

        .song-actions {
            display: flex;
            gap: 6px;
            opacity: 0.5;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .song-item:hover .song-actions { opacity: 1; }

        .song-actions button {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: 0.2s;
            line-height: 1;
        }

        .song-actions button:hover {
            background: #2a2a2a;
            color: #fff;
        }

        .song-list.grid-view .song-item {
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            padding: 12px;
            transform: none;
        }

        .song-list.grid-view .song-item:hover {
            transform: translateY(-2px);
        }

        .song-list.grid-view .song-thumb {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
        }

        @supports not (aspect-ratio: 16 / 9) {
            .song-list.grid-view .song-thumb {
                height: 0;
                padding-bottom: 56.25%;
            }
        }

        .song-list.grid-view .song-thumb .fallback-icon { font-size: 2rem; }
        .song-list.grid-view .song-info { flex: none; min-width: 0; }

        .song-list.grid-view .song-title {
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
            line-height: 1.3;
            font-size: 0.8rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .song-list.grid-view .song-meta {
            font-size: 0.6rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            min-width: 0;
            overflow: hidden;
        }

        .song-list.grid-view .song-meta > *,
        .song-list.grid-view .song-meta .dot {
            max-width: 100%;
        }

        .song-list.grid-view .song-meta .dot {
            display: none;
        }

        .song-list.grid-view .song-actions {
            opacity: 0.6;
            justify-content: flex-end;
            margin-top: auto;
        }

        .skeleton-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .skeleton-thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: linear-gradient(90deg, #1f1f1f 25%, #2a2a2a 50%, #1f1f1f 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 8px;
        }

        .skeleton-line {
            height: 10px;
            background: linear-gradient(90deg, #1f1f1f 25%, #2a2a2a 50%, #1f1f1f 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 4px;
        }

        .skeleton-line.short { width: 60%; }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .browser-panel {
            flex: 1;
            min-width: 0;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .browser-toolbar {
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
            background: #111111;
            flex-shrink: 0;
        }

        .browser-toolbar .search-wrapper {
            flex: 1;
            position: relative;
        }

        .browser-toolbar input[type="text"] {
            width: 100%;
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 8px 32px 8px 32px;
            color: #ddd;
            font-size: 0.75rem;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
            -webkit-appearance: none;
        }

        .browser-toolbar input[type="text"]:focus {
            outline: none;
            border-color: #7851A9;
            background: #2a2a2a;
            color: #fff;
        }

        .browser-toolbar .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 0.8rem;
            pointer-events: none;
        }

        .browser-toolbar .search-clear {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #666;
            font-size: 0.75rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: 0.15s;
            display: none;
            line-height: 1;
            -webkit-appearance: none;
            font-family: 'Inter', sans-serif;
        }

        .browser-toolbar .search-clear:hover {
            background: #2a2a2a;
            color: #fff;
        }

        .browser-toolbar .search-clear.visible {
            display: block;
        }

        .view-toggle {
            display: flex;
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 3px;
            gap: 3px;
            flex-shrink: 0;
        }

        .view-toggle button {
            background: transparent;
            border: none;
            color: #aaa;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .view-toggle button.active {
            background: #7851A9;
            color: #fff;
        }

        .view-toggle button:hover:not(.active) {
            background: #222;
            color: #fff;
        }

        .album-grid {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            align-content: start;
            align-items: start;
        }

        .album-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 14px 12px 12px 12px;
            transition: 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            overflow: visible;
        }

        .album-card:hover {
            border-color: var(--album-accent, #7851A9);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -8px var(--album-accent, rgba(120, 81, 169, 0.3));
        }

        .album-card.expanded {
            border-color: var(--album-accent, #7851A9);
        }

        .album-card .album-icon {
            width: 36px;
            height: 36px;
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--album-accent, #fada5e);
            margin-bottom: 2px;
        }

        .album-card .album-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.01em;
            line-height: 1.3;
            position: relative;
            padding-right: 18px;
        }

        .album-card .album-name::after {
            content: '▾';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.7rem;
            color: #666;
            transition: transform 0.2s;
        }

        .album-card.expanded .album-name::after {
            transform: translateY(-50%) rotate(180deg);
            color: var(--album-accent, #7851A9);
        }

        .album-card .album-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .album-card .playlist-count {
            font-size: 0.6rem;
            color: #aaa;
            background: #252525;
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid #333;
            font-weight: 500;
        }

        .album-card .playlist-count span {
            color: var(--album-accent, #fada5e);
            font-weight: 600;
            margin-right: 3px;
        }

        .album-card .color-dots {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 3px;
            pointer-events: none;
            z-index: 1;
        }

        .album-card .color-dots .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Playlist dropdown */
        .album-playlists {
            display: none;
            flex-direction: column;
            gap: 4px;
            padding-top: 10px;
            border-top: 1px solid #2a2a2a;
            margin-top: 2px;
            padding-bottom: 2px;
        }

        .album-card.expanded .album-playlists {
            display: flex;
        }

        .album-playlist-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            color: #ccc;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            cursor: pointer;
            transition: 0.15s;
            min-width: 0;
        }

        .album-playlist-item:hover {
            background: #1f1f1f;
            border-color: var(--pl-color, #7851A9);
            color: #fff;
        }

        .album-playlist-item .pl-swatch {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--pl-color, #7851A9);
            flex-shrink: 0;
        }

        .album-playlist-item .pl-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .album-playlist-item .pl-count {
            font-size: 0.55rem;
            color: #888;
            flex-shrink: 0;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0d0d0d; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #7851A9; }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: #666;
            font-size: 0.75rem;
            font-style: italic;
        }

        .error-state {
            padding: 40px 20px;
            text-align: center;
            color: #e88;
            font-size: 0.8rem;
            line-height: 1.6;
        }

        .error-state code {
            background: #1f1f1f;
            padding: 2px 8px;
            border-radius: 4px;
            color: #fada5e;
            font-family: 'SF Mono', monospace;
            font-size: 0.75rem;
        }

        @media (max-width: 900px) {
            .archive-main { flex-direction: column; padding: 10px; gap: 10px; }
            .song-panel { flex: 2; min-height: 0; }
            .browser-panel { flex: 1; min-height: 0; }
            .album-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 12px; }
            .album-card { padding: 12px 10px 10px 10px; gap: 8px; }
            .album-card .album-icon { width: 32px; height: 32px; font-size: 1rem; }
            .album-card .album-name { font-size: 0.8rem; }
            .song-list.grid-view { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
        }

        @media (max-width: 640px) {
            body { padding: 0; align-items: stretch; }
            .archive-container { height: 100vh; height: 100dvh; border-radius: 0; border: none; max-width: none; }
            .archive-header { padding: 10px 14px; border-radius: 0; }
            .header-left h1 { font-size: 1rem; }
            .header-left .subtitle { font-size: 0.65rem; }
            .header-right { gap: 6px; }
            .badge-pill { font-size: 0.55rem; padding: 3px 8px; }
            #albumCountBadge { display: none; }
            .archive-main { flex-direction: column; padding: 8px; gap: 8px; }
            .song-panel { flex: 2; border-radius: 10px; }
            .browser-panel { flex: 1; border-radius: 10px; }
            .song-header { padding: 10px 12px 8px 12px; gap: 8px; flex-wrap: wrap; }
            .song-header h3 { font-size: 0.7rem; }
            .song-header .song-total { font-size: 0.6rem; padding: 3px 8px; }
            .view-toggle { padding: 2px; }
            .view-toggle button { padding: 5px 8px; font-size: 0.65rem; }
            .song-list.grid-view { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px 12px 14px 12px; }
            .song-list.grid-view .song-item { padding: 10px; gap: 8px; border-radius: 10px; }
            .song-list.grid-view .song-title { font-size: 0.72rem; }
            .song-list.grid-view .song-meta { font-size: 0.55rem; }
            .song-list:not(.grid-view) { padding: 10px 12px 14px 12px; gap: 8px; }
            .song-item { padding: 10px 12px; gap: 10px; }
            .song-thumb { width: 64px; height: 36px; }
            .song-title { font-size: 0.78rem; }
            .song-meta { font-size: 0.58rem; }
            .song-actions { opacity: 0.7; }
            .album-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 10px; }
            .album-card { padding: 10px 10px 8px 10px; gap: 6px; border-radius: 10px; }
            .album-card .album-icon { width: 28px; height: 28px; font-size: 0.9rem; border-radius: 6px; }
            .album-card .album-name { font-size: 0.72rem; }
            .album-card .playlist-count { font-size: 0.55rem; padding: 2px 6px; }
            .browser-toolbar { padding: 10px 12px; }
            .browser-toolbar input[type="text"] { padding: 8px 30px 8px 30px; font-size: 0.72rem; }
            .browser-toolbar .search-icon { left: 9px; font-size: 0.75rem; }
        }

        @media (max-width: 380px) {
            .song-list.grid-view { grid-template-columns: 1fr; }
            .album-grid { grid-template-columns: 1fr; }
            .header-left .subtitle { display: none; }
        }

        @media (max-width: 900px) and (orientation: landscape) {
            .archive-main { flex-direction: row; }
            .song-panel { flex: 2; }
            .browser-panel { flex: 1; min-width: 200px; }
            .song-list.grid-view { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .album-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
            .album-card .album-name { font-size: 0.72rem; }
        }

        @media (hover: none) {
            .song-item:hover, .album-card:hover { transform: none; }
            .song-item:active, .album-card:active { background: #222; }
            .song-actions { opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="archive-container">
        <header class="archive-header">
            <div class="header-left">
                <h1>Archive Browser</h1>
                <div class="subtitle">for VC members but mostly for my sanity</div>
            </div>
            <div class="header-right">
                <div class="badge-pill" id="albumCountBadge">0 albums</div>
                <div class="badge-pill" id="songCountBadge" style="background:rgba(250,218,94,0.15); border-color:#fada5e; color:#fada5e;">▶ 0 songs</div>
				<button class="refresh-btn" id="refreshBtn" title="Re-check playlists" aria-label="Re-check playlists">⟳</button>
			</div>
        </header>

        <div class="archive-main">
            <aside class="song-panel">
                <div class="song-header">
					<h3>Anthems & songs</h3>
					<div class="view-toggle">
						<button data-view="list">List</button>
						<button class="active" data-view="grid">Grid</button>
					</div>
					<div class="song-total" id="songTotal">0 tracks</div>
				</div>
                <div class="song-list grid-view" id="songList"></div>
            </aside>

            <div class="browser-panel">
                <div class="browser-toolbar">
                    <div class="search-wrapper">
                        <span class="search-icon">🔍</span>
                        <input type="text" placeholder="Search songs, albums…" id="searchInput">
                        <button class="search-clear" id="searchClear" title="Clear search" aria-label="Clear search">✕</button>
                    </div>
                </div>
                <div class="album-grid" id="albumGrid"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // DATA — loaded from playlists.json
        // ============================================================
        let albumsData = [];

        // ============================================================
        // CACHE
        // ============================================================
        const CACHE_TTL = 1000 * 60 * 60 * 6;
        const CACHE_PREFIX = 'archive_browser_v2_';

        function getCached(key) {
            try {
                const raw = localStorage.getItem(CACHE_PREFIX + key);
                if (!raw) return null;
                const { data, timestamp } = JSON.parse(raw);
                if (Date.now() - timestamp > CACHE_TTL) {
                    localStorage.removeItem(CACHE_PREFIX + key);
                    return null;
                }
                return data;
            } catch { return null; }
        }

        function setCache(key, data) {
            try {
                localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ data, timestamp: Date.now() }));
            } catch {}
        }

		function clearAllCaches() {
			try {
				const keysToRemove = [];
				for (let i = 0; i < localStorage.length; i++) {
					const key = localStorage.key(i);
					if (key && key.startsWith(CACHE_PREFIX)) {
						keysToRemove.push(key);
					}
				}
				keysToRemove.forEach(k => localStorage.removeItem(k));
			} catch {}
		}

        // ============================================================
        // YOUTUBE FETCHING
        // ============================================================
        async function fetchPlaylistTitle(playlistId) {
            const cacheKey = `title_${playlistId}`;
            const cached = getCached(cacheKey);
            if (cached) return cached;

            try {
                const response = await fetch(
                    `https://www.youtube.com/oembed?url=https://www.youtube.com/playlist?list=${playlistId}&format=json`
                );
                if (!response.ok) throw new Error('bad status');
                const data = await response.json();
                const title = data.title || null;
                if (title) setCache(cacheKey, title);
                return title;
            } catch { return null; }
        }

        const INVIDIOUS_INSTANCES = [
            'https://inv.nadeko.net',
            'https://invidious.nerdvpn.de',
            'https://yewtu.be',
            'https://invidious.privacyredirect.com',
            'https://vid.puffyan.us'
        ];

        async function fetchPlaylistVideos(playlistId) {
            const cacheKey = `videos_${playlistId}`;
            const cached = getCached(cacheKey);
            if (cached) return cached;

            const attempts = INVIDIOUS_INSTANCES.map(async (instance) => {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 8000);
                try {
                    const response = await fetch(
                        `${instance}/api/v1/playlists/${playlistId}`,
                        { signal: controller.signal }
                    );
                    clearTimeout(timeout);
                    if (!response.ok) throw new Error('bad status');
                    const data = await response.json();
                    if (!data?.videos) throw new Error('no videos');
                    return data.videos.map(v => ({
                        videoId: v.videoId,
                        title: v.title || 'Untitled track',
                        author: v.author || '',
                        thumbnail: `https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg`
                    }));
                } catch (e) {
                    clearTimeout(timeout);
                    throw e;
                }
            });

            try {
                const videos = await Promise.any(attempts);
                setCache(cacheKey, videos);
                return videos;
            } catch { return null; }
        }

        // ============================================================
        // STATE
        // ============================================================
        let allSongs = [];
        const expandedAlbums = new Set();
        const albumGrid = document.getElementById('albumGrid');
        const songList = document.getElementById('songList');
        const songTotal = document.getElementById('songTotal');
        const albumCountBadge = document.getElementById('albumCountBadge');
        const songCountBadge = document.getElementById('songCountBadge');
        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');

        // ============================================================
        // HELPERS
        // ============================================================
        function getAlbumAccent(album) {
            return (album.playlists?.[0]?.color) || '#7851A9';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function cleanTitle(title) {
            if (!title) return '';
            return title.replace(/^\s*\[Archive\]\s*/i, '').trim();
        }

        function renderSkeletons(count = 6) {
            let html = '';
            for (let i = 0; i < count; i++) {
                html += `
                    <div class="skeleton-card">
                        <div class="skeleton-thumb"></div>
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                    </div>
                `;
            }
            songList.innerHTML = html;
        }

        // ============================================================
        // LOAD PLAYLISTS.JSON
        // ============================================================
        async function loadConfig() {
            try {
                const response = await fetch('playlists.json?t=' + Date.now());
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('playlists.json must be an array');
                albumsData = data;
                return true;
            } catch (err) {
                console.error('Failed to load playlists.json:', err);
                return false;
            }
        }

        async function loadAllData() {
            const ok = await loadConfig();
            if (!ok) {
                songList.innerHTML = `
                    <div class="error-state" style="grid-column:1/-1;">
                        ⚠️ Could not load <code>playlists.json</code><br><br>
                        Make sure it exists next to this file.<br>
                        Use the editor to create it.
                    </div>
                `;
                albumGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">No data loaded</div>`;
                songTotal.textContent = '0 videos';
                albumCountBadge.textContent = '0 albums';
                songCountBadge.textContent = '▶ 0 tracks';
                return;
            }

            renderSkeletons(6);
            allSongs = [];

            const uniquePlaylistIds = new Set();
            albumsData.forEach(album => (album.playlists || []).forEach(pl => {
                if (pl.id) uniquePlaylistIds.add(pl.id);
            }));

            // Fetch titles for playlists that don't have one
            const titlePromises = Array.from(uniquePlaylistIds).map(async (id) => {
                const title = await fetchPlaylistTitle(id);
                return { id, title };
            });
            const titleResults = await Promise.all(titlePromises);

            const playlistTitleMap = new Map();
            titleResults.forEach(({ id, title }) => {
                if (title) playlistTitleMap.set(id, title);
            });

            albumsData.forEach(album => {
                (album.playlists || []).forEach(pl => {
                    if (!pl.title && playlistTitleMap.has(pl.id)) {
                        pl.title = playlistTitleMap.get(pl.id);
                    } else if (!pl.title) {
                        pl.title = `${album.name} · playlist`;
                    }
                });
            });

            updateAll(searchInput.value);

            const allTasks = [];
            const fallbackEntries = [];

            for (const album of albumsData) {
                for (const pl of (album.playlists || [])) {
                    const task = fetchPlaylistVideos(pl.id).then(videos => {
                        if (videos && videos.length > 0) {
                            const songs = videos.map(v => ({
                                ...v,
                                albumName: album.name,
                                albumIcon: album.icon,
                                playlistTitle: pl.title,
                                playlistUrl: pl.url,
                                playlistColor: pl.color || '#7851A9'
                            }));
                            allSongs.push(...songs);
                        } else {
                            fallbackEntries.push({
                                videoId: null,
                                title: pl.title || 'Playlist',
                                author: album.name,
                                thumbnail: null,
                                albumName: album.name,
                                albumIcon: album.icon,
                                playlistTitle: pl.title,
                                playlistUrl: pl.url,
                                playlistColor: pl.color || '#7851A9',
                                isPlaylistFallback: true
                            });
                        }
                        updateAll(searchInput.value);
                    });
                    allTasks.push(task);
                }
            }

            await Promise.all(allTasks);

            if (fallbackEntries.length > 0) {
                allSongs.push(...fallbackEntries);
            }
            updateAll(searchInput.value);
        }

        // ============================================================
        // RENDER FUNCTIONS
        // ============================================================
        function renderAlbums(filterText = '') {
            const query = filterText.trim().toLowerCase();
            let html = '';
            let visibleAlbumCount = 0;

            document.querySelectorAll('.album-card.expanded').forEach(c => {
                expandedAlbums.add(c.dataset.albumId);
            });

            albumsData.forEach(album => {
                const albumNameMatches = album.name.toLowerCase().includes(query);
                const hasMatchingSong = allSongs.some(s =>
                    s.albumName === album.name &&
                    (cleanTitle(s.title).toLowerCase().includes(query) ||
                     s.title.toLowerCase().includes(query) ||
                     cleanTitle(s.playlistTitle).toLowerCase().includes(query) ||
                     s.playlistTitle.toLowerCase().includes(query))
                );

                if (query && !albumNameMatches && !hasMatchingSong) return;

                visibleAlbumCount++;

                const matchingSongs = query
                    ? allSongs.filter(s => s.albumName === album.name &&
                        (cleanTitle(s.title).toLowerCase().includes(query) ||
                         s.title.toLowerCase().includes(query) ||
                         cleanTitle(s.playlistTitle).toLowerCase().includes(query) ||
                         s.playlistTitle.toLowerCase().includes(query)))
                    : allSongs.filter(s => s.albumName === album.name);

                const accent = getAlbumAccent(album);

                const colorDots = (album.playlists || [])
                    .map(pl => `<span class="dot" style="background:${pl.color || '#7851A9'};"></span>`)
                    .join('');

                const playlistItems = (album.playlists || []).map(pl => {
                    const count = allSongs.filter(s => s.playlistTitle === pl.title && s.albumName === album.name).length;
                    return `
                        <div class="album-playlist-item" data-playlist-id="${escapeHtml(pl.id)}" style="--pl-color: ${pl.color || '#7851A9'};">
                            <span class="pl-swatch"></span>
                            <span class="pl-name">${escapeHtml(cleanTitle(pl.title || 'Loading…'))}</span>
                            <span class="pl-count">${count}</span>
                        </div>
                    `;
                }).join('');

                html += `
                    <div class="album-card ${expandedAlbums.has(album.id) ? 'expanded' : ''}" data-album-id="${escapeHtml(album.id)}" style="--album-accent: ${accent};">
                        <div class="color-dots">${colorDots}</div>
                        <div class="album-icon">${album.icon || '🎵'}</div>
                        <div class="album-name">${escapeHtml(album.name)}</div>
                        <div class="album-meta">
                            <div class="playlist-count"><span>${matchingSongs.length}</span> track${matchingSongs.length !== 1 ? 's' : ''}</div>
                        </div>
                        <div class="album-playlists">
                            ${playlistItems}
                        </div>
                    </div>
                `;
            });

            if (visibleAlbumCount === 0) {
                albumGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">No albums match “${escapeHtml(filterText)}”</div>`;
            } else {
                albumGrid.innerHTML = html;
            }
        }

        function renderSongs(filterText = '') {
            const query = filterText.trim().toLowerCase();
            let filtered = allSongs;

            if (query) {
                filtered = allSongs.filter(s =>
                    cleanTitle(s.title).toLowerCase().includes(query) ||
                    s.title.toLowerCase().includes(query) ||
                    s.albumName.toLowerCase().includes(query) ||
                    cleanTitle(s.playlistTitle).toLowerCase().includes(query) ||
                    s.playlistTitle.toLowerCase().includes(query) ||
                    (s.author && s.author.toLowerCase().includes(query))
                );
            }

            songTotal.textContent = `${filtered.length} video${filtered.length !== 1 ? 's' : ''}`;

            if (filtered.length === 0) {
                songList.innerHTML = `<div class="empty-state" style="padding:40px 0; grid-column:1/-1;">No anthems match “${escapeHtml(filterText)}”</div>`;
                return;
            }

            let html = '';
            filtered.forEach(song => {
                const videoUrl = song.videoId
                    ? `https://www.youtube.com/watch?v=${song.videoId}`
                    : song.playlistUrl;

                const thumbUrl = song.videoId
                    ? `https://i.ytimg.com/vi/${song.videoId}/mqdefault.jpg`
                    : null;

                const color = song.playlistColor || '#7851A9';

                let thumbContent = '';
                if (thumbUrl) {
                    thumbContent = `
                        <div class="fallback-icon">▶</div>
                        <img src="${thumbUrl}" alt="" loading="lazy" decoding="async" width="320" height="180"
                             onerror="this.style.display='none'; this.previousElementSibling.style.display='flex';"
                             onload="this.previousElementSibling.style.display='none';">
                    `;
                } else {
                    thumbContent = `<div class="fallback-icon">▶</div>`;
                }

                html += `
                    <div class="song-item" data-url="${escapeHtml(videoUrl)}" style="--pl-color: ${color};">
                        <div class="song-thumb">${thumbContent}</div>
                        <div class="song-info">
                            <div class="song-title">${escapeHtml(cleanTitle(song.title))}</div>
                            <div class="song-meta">
                                ${song.albumIcon || ''} ${escapeHtml(song.albumName)}
                                <span class="dot"></span>
                                <span class="playlist-pill">
                                    <span class="swatch"></span>
                                    ${escapeHtml(cleanTitle(song.playlistTitle || ''))}
                                </span>
                                ${song.author ? `<span class="dot"></span> ${escapeHtml(song.author)}` : ''}
                            </div>
                        </div>
                        <div class="song-actions">
                            <button class="open-song" title="Open on YouTube">↗</button>
                            <button class="copy-song" title="Copy link" style="font-size: 0.7rem" >📄</button>
                        </div>
                    </div>
                `;
            });
            songList.innerHTML = html;

            document.querySelectorAll('.song-item').forEach(item => {
                const url = item.dataset.url;
                item.querySelector('.open-song')?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.open(url, '_blank');
                });
                item.querySelector('.copy-song')?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    navigator.clipboard?.writeText(url).then(() => {
                        const btn = e.currentTarget;
                        const original = btn.textContent;
                        btn.textContent = '✓';
                        setTimeout(() => btn.textContent = original, 1000);
                    });
                });
                item.addEventListener('click', () => {
                    window.open(url, '_blank');
                });
            });
        }

        function updateAll(filterText) {
            renderAlbums(filterText);
            renderSongs(filterText);

            const totalAlbums = albumsData.length;
            const totalSongs = allSongs.length;
            albumCountBadge.textContent = `${totalAlbums} album${totalAlbums !== 1 ? 's' : ''}`;
            songCountBadge.textContent = `▶ ${totalSongs} track${totalSongs !== 1 ? 's' : ''}`;
        }

        // ============================================================
        // SEARCH & CLEAR
        // ============================================================
        function updateClearButton() {
            if (searchInput.value.length > 0) {
                searchClear.classList.add('visible');
            } else {
                searchClear.classList.remove('visible');
            }
        }

		const refreshBtn = document.getElementById('refreshBtn');

		refreshBtn.addEventListener('click', async () => {
			if (refreshBtn.classList.contains('spinning')) return;

			refreshBtn.classList.add('spinning');
			clearAllCaches();
			allSongs = [];
			renderSkeletons(6);

			await loadAllData();

			refreshBtn.classList.remove('spinning');
		});

        let searchTimer;
        searchInput.addEventListener('input', () => {
            updateClearButton();
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => updateAll(searchInput.value), 150);
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            updateClearButton();
            updateAll('');
            searchInput.focus();
        });

        // ============================================================
        // VIEW TOGGLE
        // ============================================================
        const viewButtons = document.querySelectorAll('.view-toggle button');
        viewButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                viewButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (btn.dataset.view === 'grid') songList.classList.add('grid-view');
                else songList.classList.remove('grid-view');
            });
        });

        // ============================================================
        // ALBUM CLICK HANDLER
        // ============================================================
        albumGrid.addEventListener('click', (e) => {
            const plItem = e.target.closest('.album-playlist-item');
            if (plItem) {
                e.stopPropagation();
                const plTitle = plItem.querySelector('.pl-name').textContent;
                searchInput.value = plTitle;
                updateClearButton();
                updateAll(plTitle);
                return;
            }

            const card = e.target.closest('.album-card');
            if (!card) return;
            const albumId = card.dataset.albumId;
            if (expandedAlbums.has(albumId)) {
                expandedAlbums.delete(albumId);
                card.classList.remove('expanded');
            } else {
                expandedAlbums.add(albumId);
                card.classList.add('expanded');
            }
        });

        // ============================================================
        // INITIAL LOAD
        // ============================================================
        renderSkeletons(6);
        loadAllData();
        updateClearButton();
    </script>
</body>
</html>
